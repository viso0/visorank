name: Unpack VisoRank

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VisoRank
        run: |
          unzip -q visorank-github-ready.zip -d extracted
          cp -a extracted/visorank-github-ready/. .
          rm -rf extracted
          rm -f visorank-github-ready.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract VisoRank project"
          git push
